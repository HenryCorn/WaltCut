[package]
name = "waltcut-platform"
description = "macOS media integration: hardware video decoding and encoding through VideoToolbox, with transparent fallback to the pure-Rust decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The one crate allowed to contain `unsafe` (OS media FFI; AGENTS.md §0.3, docs/adr/0001-platform-ffi.md).
# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`: only the FFI modules
# opt in with `#[allow(unsafe_code)]`, and every `unsafe` block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"

[dependencies]
waltcut-bitstream = { workspace = true }
waltcut-codecs = { workspace = true }
waltcut-color = { workspace = true }
waltcut-export = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-h264 = { workspace = true }
waltcut-hevc = { workspace = true }
waltcut-isobmff = { workspace = true }
waltcut-time = { workspace = true }
log = { workspace = true }
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
# Tablet pen pressure (`pen`): an NSEvent local monitor. Both already in the lockfile through winit.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6.2"

[dev-dependencies]
waltcut-testkit = { workspace = true }
waltcut-media = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
