[package]
name = "waltcut-export"
description = "Export pipeline: H.264 MP4, ProRes 4444 MOV, PNG sequences and stills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
waltcut-time = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-color = { workspace = true }
waltcut-media = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
waltcut-isobmff = { workspace = true }
waltcut-prores = { workspace = true }
waltcut-aac = { workspace = true }
waltcut-h264enc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
serde_json = { workspace = true }
waltcut-testkit = { workspace = true }
waltcut-codecs = { workspace = true }
