[package]
name = "waltcut-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
waltcut-time = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-color = { workspace = true }
waltcut-media = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
waltcut-geom = { workspace = true }
waltcut-text = { workspace = true }
waltcut-isobmff = { workspace = true }
waltcut-prores = { workspace = true }
waltcut-aac = { workspace = true }
waltcut-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
waltcut-testkit = { workspace = true }
waltcut-codecs = { workspace = true }
