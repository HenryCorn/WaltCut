[package]
name = "waltcut-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["waltcut-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["waltcut-speech/download"]
# Natural voices for Text to Speech: Kokoro-82M on candle (CPU) and their download.
neural-voices = ["waltcut-tts/kokoro", "speech-download"]
# AI re-style through cloud providers (fal.ai) over HTTPS. Off in wasm builds.
ai-cloud = ["waltcut-genai/cloud"]

[dependencies]
waltcut-time = { workspace = true }
waltcut-geom = { workspace = true }
waltcut-color = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-media = { workspace = true }
waltcut-codecs = { workspace = true }
waltcut-project = { workspace = true }
waltcut-edit = { workspace = true }
waltcut-render = { workspace = true }
waltcut-scopes = { workspace = true }
waltcut-text = { workspace = true }
waltcut-audio-dsp = { workspace = true }
waltcut-export = { workspace = true }
waltcut-mxf = { workspace = true }
waltcut-format = { workspace = true }
waltcut-interchange = { workspace = true }
waltcut-captions = { workspace = true }
waltcut-speech = { workspace = true }
waltcut-genai = { workspace = true }
waltcut-tts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craft-docpath = { workspace = true }
web-time = "1"

[dev-dependencies]
waltcut-testkit = { workspace = true }
waltcut-dng = { workspace = true, features = ["writer"] }
waltcut-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
