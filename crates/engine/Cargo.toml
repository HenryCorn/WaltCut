[package]
name = "waltcut-engine"
description = "FilmCraft engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# AI re-style through cloud providers (fal.ai) over HTTPS.
ai-cloud = ["waltcut-genai/cloud"]

[dependencies]
waltcut-time = { workspace = true }
waltcut-geom = { workspace = true }
waltcut-color = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-media = { workspace = true }
waltcut-codecs = { workspace = true }
waltcut-project = { workspace = true }
waltcut-edit = { workspace = true }
waltcut-render = { workspace = true }
waltcut-text = { workspace = true }
waltcut-audio-dsp = { workspace = true }
waltcut-export = { workspace = true }
waltcut-mxf = { workspace = true }
waltcut-format = { workspace = true }
waltcut-genai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
craft-docpath = { workspace = true }

[dev-dependencies]
waltcut-testkit = { workspace = true }
waltcut-dng = { workspace = true, features = ["writer"] }
waltcut-isobmff = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
