[package]
name = "waltcut-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
waltcut-color = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-geom = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
waltcut-time = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
pollster = "1.0"
rayon = { workspace = true }

[dev-dependencies]
pollster = "1.0"
waltcut-export = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
waltcut-media = { workspace = true }
waltcut-time = { workspace = true }
