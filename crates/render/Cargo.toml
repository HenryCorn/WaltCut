[package]
name = "waltcut-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
waltcut-time = { workspace = true }
waltcut-geom = { workspace = true }
waltcut-color = { workspace = true }
waltcut-frame = { workspace = true }
waltcut-media = { workspace = true }
waltcut-project = { workspace = true }
waltcut-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Thread CPU clock for load-robust performance tests.
rustix = { version = "1", default-features = false, features = ["std", "time"] }
