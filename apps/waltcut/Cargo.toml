[package]
name = "waltcut"
description = "FilmCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "filmcraft"
build = "build.rs"

# The binary keeps its name until the product rename (#2 step 3).
[[bin]]
name = "filmcraft"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["ai-cloud"]
# AI re-style through cloud providers (fal.ai).
ai-cloud = ["waltcut-engine/ai-cloud"]

[dependencies]
waltcut-engine = { workspace = true }
waltcut-export = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
waltcut-time = { workspace = true }
waltcut-gpu = { workspace = true }
waltcut-ui-egui = { workspace = true }
waltcut-platform = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
cpal = "0.16"
# Files and images on the system clipboard for Paste (#611); egui already uses it for text.
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
# Help menu / About / Discord links in the system browser (MIT; as PhotoCraft).
open = "5"

[dev-dependencies]
glob = "0.3"
# graphics.rs: enumerate the real adapters in a test.
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }
objc2 = "0.6"
# Same winit as eframe: macOS event-loop options (no app activation when driven by an agent).
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Settings ▸ Appearance ▸ Sync with system: the XDG desktop portal's colour scheme. The zbus the
# portal file dialogs (rfd) and accesskit already use.
zbus = "5.19"

# Icon + VERSIONINFO for filmcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
