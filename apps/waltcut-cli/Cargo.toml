[package]
name = "waltcut-cli"
description = "FilmCraft headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmcraft-cli"
path = "src/main.rs"

[features]
default = []

[dependencies]
waltcut-engine = { workspace = true }
waltcut-export = { workspace = true }
waltcut-project = { workspace = true }
waltcut-render = { workspace = true }
waltcut-time = { workspace = true }
waltcut-gpu = { workspace = true }
waltcut-media = { workspace = true }
waltcut-codecs = { workspace = true }
waltcut-platform = { workspace = true }
waltcut-mpegts = { workspace = true }
waltcut-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
waltcut-testkit = { workspace = true }
