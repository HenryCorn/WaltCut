[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/filmcraft"

[workspace.dependencies]
# internal
waltcut-time = { path = "crates/time" }
waltcut-geom = { path = "crates/geom" }
waltcut-color = { path = "crates/color" }
waltcut-bitstream = { path = "crates/bitstream" }
waltcut-isobmff = { path = "crates/isobmff" }
waltcut-avi = { path = "crates/avi" }
waltcut-matroska = { path = "crates/matroska" }
waltcut-mpegts = { path = "crates/mpegts" }
waltcut-mpeg2v = { path = "crates/mpeg2v" }
waltcut-mpa = { path = "crates/mpa" }
waltcut-h264 = { path = "crates/h264" }
waltcut-hevc = { path = "crates/hevc" }
waltcut-vp9 = { path = "crates/vp9" }
waltcut-prores = { path = "crates/prores" }
waltcut-av1 = { path = "crates/av1" }
waltcut-aac = { path = "crates/aac" }
waltcut-opus = { path = "crates/opus" }
waltcut-h264enc = { path = "crates/h264enc" }
waltcut-audio-dsp = { path = "crates/audio-dsp" }
waltcut-frame = { path = "crates/frame" }
waltcut-media = { path = "crates/media" }
waltcut-codecs = { path = "crates/codecs" }
waltcut-project = { path = "crates/project" }
waltcut-edit = { path = "crates/edit" }
waltcut-text = { path = "crates/text" }
waltcut-genai = { path = "crates/genai" }
waltcut-render = { path = "crates/render" }
waltcut-gpu = { path = "crates/gpu" }
waltcut-export = { path = "crates/export" }
waltcut-format = { path = "crates/format" }
waltcut-engine = { path = "crates/engine" }
waltcut-ui-egui = { path = "crates/ui-egui" }
waltcut-automation = { path = "crates/automation" }
waltcut-platform = { path = "crates/platform" }
waltcut-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.waltcut-h264]
opt-level = 3

[profile.dev.package.waltcut-h264enc]
opt-level = 3

[profile.dev.package.waltcut-hevc]
opt-level = 3

[profile.dev.package.waltcut-prores]
opt-level = 3

[profile.dev.package.waltcut-av1]
opt-level = 3

[profile.dev.package.waltcut-aac]
opt-level = 3

# Shuttle pitch correction and streaming playback resampling.
[profile.dev.package.waltcut-audio-dsp]
opt-level = 3

[profile.dev.package.waltcut-opus]
opt-level = 3

[profile.dev.package.waltcut-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
