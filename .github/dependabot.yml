version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Keep breaking upgrades isolated; review migration notes per package.
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        # These 0.x libraries can require migrations even on a minor update.
        exclude-patterns:
          - "egui*"
          - "eframe"
          - "cpal"
          - "symphonia*"
          - "skrifa"
          - "harfrust"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # This action uses Rust release versions as refs, not action semver.
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "ci(deps)"
