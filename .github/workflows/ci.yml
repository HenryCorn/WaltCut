name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      full_quality:
        description: Run the full workspace Clippy, test, layer, and asset gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full_quality)
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: macos-verification
          cache-on-failure: true
      - name: Report cache restore
        run: echo "Rust cache hit = $CACHE_HIT"
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      - name: Install ffmpeg (test oracle)
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Fast PR gate
        if: github.event_name == 'pull_request'
        run: cargo xtask check --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Fast local-equivalent gate
        if: github.event_name != 'pull_request'
        run: cargo xtask check --base origin/main

  full-quality:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.full_quality) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-quality'))
    name: full quality gates
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: macos-verification
          cache-on-failure: true
      - name: Report cache restore
        run: echo "Rust cache hit = $CACHE_HIT"
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      - name: Install ffmpeg (test oracle)
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Run full quality gates
        run: cargo xtask ci
